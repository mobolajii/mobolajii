<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
<style>
.head{transform-origin:200px 190px;animation:head 6s infinite ease-in-out}
@keyframes head{0%,50%{transform:rotate(0)}58%,84%{transform:rotate(-4deg)}94%,100%{transform:rotate(0)}}
.look{animation:look 6s infinite steps(1)}
@keyframes look{0%,52%{transform:translate(0,5px)}53%,92%{transform:translate(0,0)}93%,100%{transform:translate(0,5px)}}
.lh{animation:tl .5s infinite alternate ease-in-out}
.rh{animation:tl .38s infinite alternate-reverse ease-in-out}
@keyframes tl{from{transform:translateY(0)}to{transform:translateY(4px)}}
.typing{animation:ty 6s infinite steps(1)}
@keyframes ty{0%,50%{opacity:1}51%,94%{opacity:0}95%,100%{opacity:1}}
.wave{opacity:0;transform-origin:292px 262px;animation:wv 6s infinite}
@keyframes wv{0%,56%{opacity:0;transform:rotate(0)}58%{opacity:1;transform:rotate(0)}64%{transform:rotate(-18deg)}70%{transform:rotate(12deg)}76%{transform:rotate(-18deg)}82%{transform:rotate(12deg)}88%{opacity:1;transform:rotate(0)}90%,100%{opacity:0}}
.hi{opacity:0;animation:hi 6s infinite}
@keyframes hi{0%,56%{opacity:0}60%,88%{opacity:1}92%,100%{opacity:0}}
.smile{opacity:0;animation:hi 6s infinite}
.sym{animation:fl 3s infinite ease-in-out}
@keyframes fl{0%{opacity:0;transform:translateY(10px)}50%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
</style>
<rect width="480" height="300" rx="16" fill="#f4eee8"/>
<g font-family="monospace" font-size="9.5">
<rect x="10" y="34" width="164" height="140" rx="9" fill="#1e1e2e"/>
<circle cx="22" cy="46" r="3" fill="#ff5f57"/><circle cx="32" cy="46" r="3" fill="#febc2e"/><circle cx="42" cy="46" r="3" fill="#28c840"/>
<text x="18" y="68" fill="#c792ea">function <tspan fill="#82aaff">hello</tspan><tspan fill="#d4d4d4">() {</tspan></text>
<text x="26" y="84" fill="#d4d4d4"><tspan fill="#82aaff">fetch</tspan>(data);</text>
<text x="26" y="100" fill="#d4d4d4"><tspan fill="#82aaff">render</tspan>(ui);</text>
<text x="26" y="116" fill="#c792ea">return <tspan fill="#c3e88d">"hi!"</tspan><tspan fill="#d4d4d4">;</tspan></text>
<text x="18" y="132" fill="#d4d4d4">}</text>
<text x="18" y="150" fill="#546e7a">// ship it</text>
<rect x="46" y="140" width="5" height="11" fill="#7a5af8"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</g>
<g transform="translate(88,0)">
<!-- body -->
<path d="M95 300 Q100 232 150 222 L250 222 Q300 232 305 300Z" fill="#141414"/>
<path d="M110 300 Q115 238 158 226 L200 262 L242 226 Q285 238 290 300Z" fill="#c8ab8b"/>
<path d="M178 222 L200 262 L222 222Z" fill="#141414"/>
<path d="M176 220 L192 236 L200 224Z M224 220 L208 236 L200 224Z" fill="#2a2a2a"/>
<!-- neck -->
<rect x="184" y="196" width="32" height="30" fill="#7b4a30"/>
<!-- head group -->
<g transform="translate(0,16)"><g class="head">
<!-- hair back -->
<g fill="#0c0c0e">
<circle cx="200" cy="130" r="62"/><circle cx="152" cy="150" r="30"/><circle cx="248" cy="150" r="30"/><circle cx="140" cy="118" r="26"/><circle cx="260" cy="118" r="26"/><circle cx="168" cy="82" r="28"/><circle cx="232" cy="82" r="28"/><circle cx="200" cy="72" r="30"/><circle cx="132" cy="170" r="22"/><circle cx="268" cy="170" r="22"/>
</g>
<ellipse cx="200" cy="148" rx="42" ry="50" fill="#8a5738"/>
<path d="M158 118 Q200 84 242 118 Q232 96 200 92 Q168 96 158 118Z" fill="#0c0c0e"/>
<!-- ears hidden by hair; brows -->
<path d="M175 126 Q184 121 193 126M207 126 Q216 121 225 126" stroke="#0c0c0e" stroke-width="3" fill="none" stroke-linecap="round"/>
<!-- eyes -->
<g><ellipse cx="184" cy="141" rx="8" ry="6" fill="#fff"/><ellipse cx="216" cy="141" rx="8" ry="6" fill="#fff"/>
<g class="look"><circle cx="184" cy="141" r="4" fill="#1a0f0a"/><circle cx="216" cy="141" r="4" fill="#1a0f0a"/></g>
<path d="M176 140 Q184 134 192 140M208 140 Q216 134 224 140" stroke="#0c0c0e" stroke-width="2" fill="none"/></g>
<path d="M200 146 Q196 160 202 162" stroke="#6a3c24" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<path d="M188 174 Q200 178 212 174" stroke="#5a2a20" stroke-width="3" fill="none" stroke-linecap="round"/>
<g class="smile"><path d="M186 171 Q200 190 214 171Z" fill="#b5403a"/><path d="M190 173 Q200 178 210 173Z" fill="#fff"/></g>
</g>
</g>
<!-- laptop -->
<path d="M126 296 L140 252 Q142 246 150 246 L250 246 Q258 246 260 252 L274 296Z" fill="#d5d9e0" stroke="#7d838d" stroke-width="3" stroke-linejoin="round"/>
<path d="M114 300 L286 300 L286 292 Q286 288 280 288 L120 288 Q114 288 114 292Z" fill="#a9afb9" stroke="#7d838d" stroke-width="3"/>
<path d="M188 270 q12 -14 24 0 q-12 14 -24 0z" fill="#7d838d"/>
<!-- hands typing -->
<g class="typing"><g class="lh"><ellipse cx="170" cy="248" rx="14" ry="8" fill="#7b4a30"/></g><g class="rh"><ellipse cx="230" cy="248" rx="14" ry="8" fill="#7b4a30"/></g></g>
<!-- waving hand -->
<g class="wave"><path d="M270 290 Q285 270 292 255" stroke="#141414" stroke-width="18" stroke-linecap="round" fill="none"/><circle cx="292" cy="246" r="13" fill="#7b4a30"/></g>
</g>
<!-- bubble -->
<g transform="translate(96,-14)">
<g class="hi"><rect x="268" y="60" width="86" height="46" rx="14" fill="#fff" stroke="#7a5af8" stroke-width="3"/><path d="M280 106 L270 124 L296 106Z" fill="#fff" stroke="#7a5af8" stroke-width="3" stroke-linejoin="round"/><rect x="276" y="104" width="22" height="5" fill="#fff"/><text x="311" y="91" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="26" fill="#7a5af8">hi!</text></g>
</g>
</svg>
