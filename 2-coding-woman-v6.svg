<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300"><style>
.mv{animation:mv 6s infinite ease-in-out}
@keyframes mv{0%,42%{transform:translate(-30px,22px)}52%,90%{transform:translate(100px,0)}100%{transform:translate(-30px,22px)}}
.head{transform-origin:200px 190px;animation:head 6s infinite ease-in-out}
@keyframes head{0%,42%{transform:rotate(0)}52%{transform:rotate(-4deg)}58%,88%{transform:rotate(-6deg)}100%{transform:rotate(0)}}
.bob{animation:bob .45s infinite alternate ease-in-out}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(2px)}}
.look{animation:look 6s infinite steps(1)}
@keyframes look{0%,50%{transform:translate(0,5px)}51%,92%{transform:translate(0,0)}93%,100%{transform:translate(0,5px)}}
.wave{opacity:0;transform-origin:292px 262px;animation:wv 6s infinite}
@keyframes wv{0%,54%{opacity:0;transform:rotate(0)}56%{opacity:1;transform:rotate(0)}62%{transform:rotate(-18deg)}68%{transform:rotate(12deg)}74%{transform:rotate(-18deg)}80%{transform:rotate(12deg)}86%{opacity:1;transform:rotate(0)}88%,100%{opacity:0}}
.hi{opacity:0;animation:hi 6s infinite}
@keyframes hi{0%,54%{opacity:0}58%,86%{opacity:1}90%,100%{opacity:0}}
.smile{opacity:0;animation:hi 6s infinite}
.sym{animation:fl 3s infinite ease-in-out}
@keyframes fl{0%{opacity:0;transform:translateY(10px)}50%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
</style><g font-family="monospace" font-size="10.5" font-weight="bold"><text class="sym" style="animation-delay:0s" x="120" y="24" fill="#c792ea">// it works, why?</text><text class="sym" style="animation-delay:1.2s" x="150" y="52" fill="#82aaff">console.log('here')</text><text class="sym" style="animation-delay:0.6s" x="6" y="140" fill="#ffcb6b">// TODO: sleep</text><text class="sym" style="animation-delay:1.8s" x="2" y="100" fill="#c3e88d">while(!coffee)</text><text class="sym" style="animation-delay:0.3s" x="6" y="68" fill="#f78c6c">git blame me</text><text class="sym" style="animation-delay:2.2s" x="6" y="32" fill="#89ddff">ctrl+z ctrl+z</text><text class="sym" style="animation-delay:0.9s" x="388" y="130" fill="#f07178">rm -rf bugs/</text><text class="sym" style="animation-delay:1.5s" x="388" y="170" fill="#c3e88d">// fix later</text><text class="sym" style="animation-delay:2.4s" x="385" y="205" fill="#82aaff">bugs=0 // lol</text><text class="sym" style="animation-delay:2.0s" x="388" y="100" fill="#ffcb6b">git push -f</text><text class="sym" style="animation-delay:0.4s" x="300" y="14" fill="#c792ea">// hi mom</text></g><g class="mv"><g class="bob"><!-- body -->
