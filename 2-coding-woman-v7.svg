<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300"><style>
.bob{animation:bob .45s infinite alternate ease-in-out}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(2px)}}
.lean{animation:lean 6s infinite ease-in-out}
@keyframes lean{0%,42%{transform:translate(0,0) rotate(0)}52%,88%{transform:translate(118px,-20px) rotate(10deg)}100%{transform:translate(0,0) rotate(0)}}
.neck{transform-origin:200px 226px;animation:neck 6s infinite ease-in-out}
@keyframes neck{0%,42%{transform:skewX(0)}52%,88%{transform:skewX(-70deg)}100%{transform:skewX(0)}}
.look{animation:look 6s infinite steps(1)}
@keyframes look{0%,50%{transform:translate(0,5px)}51%,92%{transform:translate(0,0)}93%,100%{transform:translate(0,5px)}}
.hi{opacity:0;animation:hi 6s infinite}
@keyframes hi{0%,54%{opacity:0}58%,86%{opacity:1}90%,100%{opacity:0}}
.smile{opacity:0;animation:hi 6s infinite}
.sym{animation:fl 3s infinite ease-in-out}
@keyframes fl{0%{opacity:0;transform:translateY(10px)}50%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
</style><g font-family="monospace" font-size="10.5" font-weight="bold"><text class="sym" style="animation-delay:0s" x="120" y="24" fill="#c792ea">const app = express()</text><text class="sym" style="animation-delay:1.2s" x="150" y="52" fill="#82aaff">git commit -m &apos;feat&apos;</text><text class="sym" style="animation-delay:0.6s" x="6" y="140" fill="#ffcb6b">npm run build</text><text class="sym" style="animation-delay:1.8s" x="2" y="100" fill="#c3e88d">await db.query()</text><text class="sym" style="animation-delay:0.3s" x="6" y="68" fill="#f78c6c">kafka.send(event)</text><text class="sym" style="animation-delay:2.2s" x="6" y="32" fill="#89ddff">pytest -q</text><text class="sym" style="animation-delay:0.9s" x="396" y="130" fill="#f07178">docker up</text><text class="sym" style="animation-delay:1.5s" x="396" y="170" fill="#c3e88d">@Service</text><text class="sym" style="animation-delay:2.4s" x="396" y="205" fill="#82aaff">tests: pass</text><text class="sym" style="animation-delay:2.0s" x="396" y="100" fill="#ffcb6b">orders{id}</text><text class="sym" style="animation-delay:0.4s" x="290" y="14" fill="#c792ea">git push origin main</text></g><g transform="translate(20,0)"><g class="bob"><g transform="translate(-30,22)"><!-- body -->
