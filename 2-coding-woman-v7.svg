</g>
</g>
<g class="wave" style="display:none"><path d="M270 290 Q285 270 292 255" stroke="#141414" stroke-width="18" stroke-linecap="round" fill="none"/><circle cx="292" cy="246" r="13" fill="#7b4a30"/></g></g></g></g></g><g>
