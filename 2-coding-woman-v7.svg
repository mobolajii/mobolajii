<!-- eyes -->
<g><ellipse cx="184" cy="141" rx="8" ry="6" fill="#fff"/><ellipse cx="216" cy="141" rx="8" ry="6" fill="#fff"/>
<g class="look"><circle cx="184" cy="141" r="4" fill="#1a0f0a"/><circle cx="216" cy="141" r="4" fill="#1a0f0a"/></g>
