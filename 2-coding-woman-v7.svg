<!-- hair back -->
<g fill="#0c0c0e">
<circle cx="200" cy="130" r="62"/><circle cx="152" cy="150" r="30"/><circle cx="248" cy="150" r="30"/><circle cx="140" cy="118" r="26"/><circle cx="260" cy="118" r="26"/><circle cx="168" cy="82" r="28"/><circle cx="232" cy="82" r="28"/><circle cx="200" cy="72" r="30"/><circle cx="132" cy="170" r="22"/><circle cx="268" cy="170" r="22"/>
</g>
